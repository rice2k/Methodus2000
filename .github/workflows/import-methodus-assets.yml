name: Import Methodus archive assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-methodus-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout archive
        uses: actions/checkout@v4

      - name: Create archive folders
        run: |
          mkdir -p downloads/methodus-toolz-2.x downloads/methodus-3 assets/screenshots/methodus-toolz-2 assets/screenshots/methodus-3

      - name: Import known Methodus program archives
        shell: bash
        run: |
          set -u
          fetch_file() {
            out="$1"; shift
            mkdir -p "$(dirname "$out")"
            rm -f "$out" "$out.tmp"
            for url in "$@"; do
              echo "Trying $out from $url"
              if curl -fL --retry 2 --connect-timeout 20 --max-time 180 "$url" -o "$out.tmp"; then
                if [ -s "$out.tmp" ]; then
                  mv "$out.tmp" "$out"
                  echo "Recovered $out ($(stat -c%s "$out") bytes)"
                  return 0
                fi
              fi
              rm -f "$out.tmp"
            done
            echo "Not recovered in this pass: $out"
            return 0
          }

          fetch_file 'downloads/methodus-3/methodus-toolz-3.0-aol-5.0-7.0.zip' \
            'https://raw.githubusercontent.com/ssstonebraker/aolunderground-proggies/main/programs/AOL/proggies-sorted-deduped/proggies-by-version/unknown/methodus%20toolz%203.0%20for%20aol%205.0-7.0.zip'

          fetch_file 'downloads/methodus-3/methodus3b9.exe' \
            'https://www.methodus2000.com/methodus3b9.exe' \
            'https://web.archive.org/web/20020112000000id_/http://www.methodus2000.com/methodus3b9.exe'

          fetch_file 'downloads/methodus-3/methodus3b2.zip' \
            'https://web.archive.org/web/20020101000000id_/http://lenshellarchive.com/Progs/aolprogs/methodus3b2.zip'

          fetch_file 'downloads/methodus-toolz-2.x/methodus.zip' \
            'https://web.archive.org/web/20010101000000id_/http://lenshellarchive.com/Progs/aolprogs/methodus.zip' \
            'https://web.archive.org/web/20010101000000id_/http://www.cybernyse.com/downlowdz/methodus.zip' \
            'https://web.archive.org/web/20010101000000id_/http://www.oogle.net/downloads/progs/methodus.zip'

          fetch_file 'downloads/methodus-toolz-2.x/methodus.exe' \
            'https://web.archive.org/web/20010101000000id_/http://www.methodus2000.com/methodustoolz/methodus.exe' \
            'https://web.archive.org/web/20010101000000id_/http://methodus.bizland.com/methodus.exe' \
            'https://web.archive.org/web/20010101000000id_/http://methimages.hypermart.net/methodus.exe'

      - name: Recover Methodus Toolz 2 screenshot set
        shell: bash
        run: |
          set -u
          fetch_image() {
            out="$1"; shift
            mkdir -p "$(dirname "$out")"
            rm -f "$out" "$out.tmp"
            for url in "$@"; do
              if curl -fL --retry 2 --connect-timeout 20 --max-time 90 "$url" -o "$out.tmp"; then
                if python - "$out.tmp" <<'PY'
          import sys
          from pathlib import Path
          b=Path(sys.argv[1]).read_bytes()
          ok=b.startswith(b'\xff\xd8\xff') or b.startswith(b'GIF87a') or b.startswith(b'GIF89a') or b.startswith(b'\x89PNG\r\n\x1a\n')
          raise SystemExit(0 if ok else 1)
          PY
                then mv "$out.tmp" "$out"; echo "Recovered $out"; return 0; fi
              fi
              rm -f "$out.tmp"
            done
            return 0
          }

          for name in fader.jpg phishmassim.jpg main.jpg anonymailer.jpg browser.jpg chatpicscroll.jpg imanswer.jpg macroeditor.jpg macrofont.jpg netbusclone.jpg phishtank.jpg game.jpg; do
            fetch_image "assets/screenshots/methodus-toolz-2/$name" \
              "https://www.methodus2000.com/methodustoolz/screenshots/$name" \
              "https://web.archive.org/web/20010119035500id_/http://www.methodus2000.com/methodustoolz/screenshots/$name"
          done

      - name: Recover Methodus 3 screenshot set
        shell: bash
        run: |
          set -u
          fetch_image() {
            name="$1"
            out="assets/screenshots/methodus-3/$name"
            rm -f "$out" "$out.tmp"
            for url in \
              "https://www.methodus2000.com/methodus3/screenshots/$name" \
              "https://web.archive.org/web/20020112000000id_/http://www.methodus2000.com/methodus3/screenshots/$name"; do
              echo "Trying $name"
              if curl -fL --retry 2 --connect-timeout 20 --max-time 90 "$url" -o "$out.tmp"; then
                if python - "$out.tmp" <<'PY'
          import sys
          from pathlib import Path
          b=Path(sys.argv[1]).read_bytes()
          ok=b.startswith(b'\xff\xd8\xff') or b.startswith(b'GIF87a') or b.startswith(b'GIF89a') or b.startswith(b'\x89PNG\r\n\x1a\n')
          raise SystemExit(0 if ok else 1)
          PY
                then mv "$out.tmp" "$out"; echo "Recovered $name"; return 0; fi
              fi
              rm -f "$out.tmp"
            done
            return 0
          }

          for name in \
            crapster1.gif crapster2.gif crapsterdl1.gif crapsterdl2.gif \
            imfader1.gif imfader2.gif skin1.gif skin2.gif skins1.gif skins2.gif \
            aolback1.gif aolback2.gif anonymailer1.gif anonymailer2.gif \
            breakout1.gif breakout2.gif dirty1.gif dirty2.gif browser1.gif browser2.gif \
            cdburner1.gif cdburner2.gif cdrip1.gif cdrip2.gif \
            chatpicscroll1.gif chatpicscroll2.gif ftpclient1.gif ftpclient2.gif \
            hotkey1.gif hotkey2.gif immanager1.gif immanager2.gif keyspy1.gif keyspy2.gif \
            macroeditor1.gif macroeditor2.gif macrofont1.gif macrofont2.gif \
            massimer1.gif massimer2.gif mp3enc1.gif mp3enc2.gif options1.gif options2.gif \
            roombust1.gif roombust2.gif; do
            fetch_image "$name"
          done

      - name: Validate archives and create inventory
        shell: bash
        run: |
          set -u
          mkdir -p docs
          for f in downloads/**/*.zip downloads/*.zip; do
            [ -f "$f" ] || continue
            python - "$f" <<'PY'
          import sys, zipfile
          p=sys.argv[1]
          try:
              with zipfile.ZipFile(p) as z:
                  bad=z.testzip()
                  print(f'ZIP OK: {p}; entries={len(z.infolist())}; first_bad={bad}')
          except Exception as e:
              print(f'ZIP WARNING: {p}: {e}')
          PY
          done

          {
            echo '# SHA-256 checksums'
            echo
            find downloads assets/screenshots -type f ! -name README.md -print0 | sort -z | xargs -0 sha256sum || true
          } > SHA256SUMS.txt

          {
            echo '# Local Methodus archive files'
            echo
            echo 'Everything listed here is stored directly in the Rice2k/Methodus2000 repository after successful recovery.'
            echo
            echo '## Program files / downloads'
            find downloads -type f ! -name README.md -printf '- `%p` — %s bytes\n' | sort
            echo
            echo '## Screenshot files'
            find assets/screenshots -type f ! -name README.md -printf '- `%p` — %s bytes\n' | sort
            echo
            echo 'See `SHA256SUMS.txt` for integrity hashes.'
          } > docs/LOCAL-FILES.md

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rice2k-archive-bot'
          git config user.email '43998502+rice2k@users.noreply.github.com'
          git add downloads assets/screenshots SHA256SUMS.txt docs/LOCAL-FILES.md
          if git diff --cached --quiet; then
            echo 'No new assets to commit.'
            exit 0
          fi
          git commit -m 'Import Methodus versions and screenshot assets'
          git push
